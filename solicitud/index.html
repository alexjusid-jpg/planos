<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Project request · בקשת פרויקט · Solicitud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Formulario de solicitud (Planos Máster). Una columna, bloques numerados. Fondo blanco siempre. */
:root{--bg:#FFFFFF;--ink:#1F2430;--muted:#5E6675;--line:#DCE0E6;--soft:#F5F6F8;--accent:#C9662A;--accent-soft:#FBEDE4;--ok:#2E7D4F;--warn:#B4541A;--navy:#27306B;
  --body:"Heebo",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 60px max(14px,env(safe-area-inset-left,0px))}
.home{display:inline-block;margin-bottom:8px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:14px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--accent);padding-bottom:12px}
h1{font:800 24px/1.15 var(--body);margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.langs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.langs button{font:600 14px var(--body);border:0;background:var(--bg);color:var(--ink);padding:7px 12px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
form{display:grid;gap:16px;margin-top:14px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;display:grid;gap:12px;min-width:0}
legend{font:700 16px var(--body);padding:0 6px;display:flex;align-items:center;gap:8px}
legend .n{font:500 12px var(--mono);color:#fff;background:var(--accent);border-radius:4px;padding:1px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-weight:500;font-size:14px;min-width:0}
input[type=text],input[type=date],input[type=number],textarea,select{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.yn{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.yn .q{font-weight:500;font-size:14px;margin-inline-end:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;user-select:none;background:var(--bg)}
.pill input{accent-color:var(--accent);margin:0}
.pill:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--soft)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .hint{font-size:13px;color:var(--muted)}
.files{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.files li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0}
.files li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files img{width:44px;height:44px;object-fit:cover;border-radius:4px;flex:none}
.files button{border:0;background:none;color:var(--warn);cursor:pointer;font-weight:700;font-size:16px}
.cond[hidden]{display:none!important}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.btn{font:700 16px var(--body);background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;text-align:center;text-decoration:none}
.btn.navy{background:var(--navy)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:5px 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.status{font-size:14px;min-height:20px}
.status.ok{color:var(--ok);font-weight:600}.status.err{color:var(--warn);font-weight:600}
.note{font-size:13px;color:var(--muted)}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}.prog[hidden]{display:none}.prog i{display:block;height:100%;width:0;background:var(--accent)}
pre{white-space:pre-wrap;border:1px solid var(--line);border-radius:6px;padding:10px;max-height:260px;overflow:auto;font:13px var(--body);color:var(--muted)}
@media (max-width:520px){h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../" id="home">← <span data-t="home"></span></a>
  <header>
    <div><h1 data-t="title"></h1><p class="sub" data-t="sub"></p><p class="sub" id="updnote" hidden style="color:var(--accent);font-weight:600"></p></div>
    <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="he">עב</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div>
  </header>

  <form id="f" novalidate onsubmit="return false">
    <fieldset>
      <legend><span class="n">1</span><span data-t="s1"></span></legend>
      <div class="grid">
        <label class="f"><span data-t="project"></span><input type="text" id="project" autocomplete="off"></label>
        <label class="f"><span data-t="projectHe"></span><input type="text" id="projectHe" dir="rtl" autocomplete="off"></label>
        <label class="f"><span data-t="client"></span><input type="text" id="client" autocomplete="off"></label>
        <label class="f"><span data-t="dist"></span><input type="text" id="dist" value="Orad"></label>
        <label class="f"><span data-t="req"></span><input type="text" id="req" autocomplete="name"></label>
        <label class="f"><span data-t="date"></span><input type="date" id="date"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend><span class="n">2</span><span data-t="s2"></span></legend>
      <div class="yn"><span class="q" data-t="plansQ"></span>
        <label class="pill"><input type="radio" name="plans" value="Y"><span data-t="yes"></span></label>
        <label class="pill"><input type="radio" name="plans" value="N" checked><span data-t="no"></span></label></div>
      <div class="cond" data-when="plans" hidden><div class="yn" id="ptypes"></div><div class="drop" data-field="plans" style="margin-top:8px"></div></div>

      <div class="yn"><span class="q" data-t="boqQ"></span>
        <label class="pill"><input type="radio" name="boq" value="Y"><span data-t="yes"></span></label>
        <label class="pill"><input type="radio" name="boq" value="N" checked><span data-t="no"></span></label></div>
      <div class="drop cond" data-field="boq" data-when="boq" hidden></div>

      <div class="yn"><span class="q" data-t="specQ"></span>
        <label class="pill"><input type="radio" name="spec" value="Y"><span data-t="yes"></span></label>
        <label class="pill"><input type="radio" name="spec" value="N" checked><span data-t="no"></span></label></div>
      <div class="drop cond" data-field="spec" data-when="spec" hidden></div>

      <div class="yn"><span class="q" data-t="cabQ"></span>
        <label class="pill"><input type="radio" name="cab" value="Y"><span data-t="yes"></span></label>
        <label class="pill"><input type="radio" name="cab" value="N" checked><span data-t="no"></span></label></div>
      <div class="drop cond" data-field="cabling" data-when="cab" hidden></div>

      <div class="yn"><span class="q" data-t="otherQ"></span></div>
      <div class="drop" data-field="other"></div>
    </fieldset>

    <fieldset>
      <legend><span class="n">3</span><span data-t="s3"></span></legend>
      <div class="grid">
        <label class="f"><span data-t="floors"></span><input type="number" min="0" id="floors" inputmode="numeric"></label>
        <label class="f"><span data-t="rooms"></span><input type="number" min="0" id="rooms" inputmode="numeric"></label>
        <label class="f"><span data-t="beds"></span><input type="number" min="0" id="beds" inputmode="numeric"></label>
        <label class="f"><span data-t="baths"></span>
          <select id="baths"><option value="" data-t="choose"></option><option value="T" data-t="bathsT"></option><option value="S" data-t="bathsS"></option><option value="M" data-t="bathsM"></option><option value="N" data-t="bathsN"></option></select></label>
      </div>
      <div class="yn"><span class="q" data-t="voice"></span>
        <label class="pill"><input type="radio" name="voice" value="Y"><span data-t="yes"></span></label>
        <label class="pill"><input type="radio" name="voice" value="N"><span data-t="no"></span></label>
        <label class="pill"><input type="radio" name="voice" value="?" checked><span data-t="unk"></span></label></div>
      <div class="yn"><span class="q" data-t="shabbat"></span>
        <label class="pill"><input type="radio" name="shabbat" value="Y"><span data-t="yes"></span></label>
        <label class="pill"><input type="radio" name="shabbat" value="N"><span data-t="no"></span></label>
        <label class="pill"><input type="radio" name="shabbat" value="?" checked><span data-t="unk"></span></label></div>
      <div class="yn" id="feats"><span class="q" data-t="includes"></span></div>
      <label class="f"><span data-t="free"></span><textarea id="free"></textarea></label>
      <div class="drop" data-field="free"></div>
    </fieldset>

    <fieldset>
      <legend><span class="n">4</span><span data-t="s4"></span></legend>
      <div class="yn" id="extras"></div>
      <label class="f"><span data-t="extrasOther"></span><input type="text" id="extrasOther"></label>
    </fieldset>

    <fieldset>
      <legend><span class="n">5</span><span data-t="s5"></span></legend>
      <p class="note" data-t="s5n" style="margin:0"></p>
      <label class="f"><span data-t="look"></span><textarea id="look"></textarea></label>
      <div class="drop" data-field="ideas" data-accept="image/*,.pdf,.pptx,.dwg,.dxf,.skp,.ifc,.rvt"></div>
    </fieldset>

    <fieldset>
      <legend><span class="n">6</span><span data-t="s6"></span></legend>
      <p class="note" data-t="bigNote" style="margin:0"></p>
      <label class="f"><span data-t="links"></span><textarea id="links" style="min-height:60px" dir="ltr"></textarea></label>
    </fieldset>

    <fieldset>
      <legend><span class="n">7</span><span data-t="s7"></span></legend>
      <div class="actions">
        <button class="btn" type="button" id="send" data-t="send" hidden></button>
        <button class="btn" type="button" id="share" data-t="share"></button>
        <button class="btn navy" type="button" id="zipb" data-t="zip"></button>
        <a class="btn ghost" id="wa" href="https://wa.me/" target="_blank" rel="noopener" data-t="wa"></a>
        <button class="btn ghost" type="button" id="copy" data-t="copy"></button>
      </div>
      <div class="prog" id="prog" hidden><i></i></div>
      <span class="status" id="status" role="status"></span>
      <p class="note" data-t="howto" style="margin:0"></p>
      <button class="btn ghost sm" type="button" id="clear" data-t="clear" style="justify-self:start"></button>
      <pre id="preview"></pre>
    </fieldset>
  </form>
</div>

  for (const k in dict) { const l = document.createElement("label"); l.className = "pill";

    const s = document.createElement("span"); s.textContent = dict[k]; l.append(i, s); box.append(l); }
}
function setLang(l) {
  const on = [...document.querySelectorAll("#ptypes input:checked,#feats input:checked,#extras input:checked")].map(i => i.id);
  LANG = l; try { localStorage.setItem("planos-lang", l); } catch (_) {}
  const L = T[l]; document.documentElement.lang = l; document.documentElement.dir = l === "he" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => { const v = L[e.dataset.t]; if (typeof v === "string") e.textContent = v; });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  pills("ptypes", "ptype", L.ptypes); pills("feats", "feat", L.feats); pills("extras", "extra", L.extras);
  on.forEach(id => { const e = $(id); if (e) e.checked = true; });
  $("home").href = "../?lang=" + l;
  if (MODE === "update") { document.querySelector("h1").textContent = L.updT; document.querySelector(".sub").textContent = L.updS; document.title = L.updT;
    if (PRJ) { $("updnote").hidden = false; $("updnote").textContent = L.updN + PRJ; } }
  $("send").hidden = !ENDPOINT;
  document.querySelectorAll(".drop").forEach(drawDrop); refresh();
}
function drawDrop(d) {
  const L = T[LANG], f = d.dataset.field; d.innerHTML = "";
  const top = document.createElement("div"); top.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;align-items:center";
  const t = document.createElement("span"); t.textContent = L.drop;
  const inp = document.createElement("input"); inp.type = "file"; inp.multiple = true; inp.style.display = "none"; if (d.dataset.accept) inp.accept = d.dataset.accept;
  const b = document.createElement("button"); b.type = "button"; b.className = "btn ghost sm"; b.textContent = L.pick; b.onclick = () => inp.click();
  inp.onchange = () => { add(f, inp.files); inp.value = ""; };
  top.append(t, b, inp);
  if (f === "ideas" || f === "free" || f === "other") { const cam = document.createElement("input"); cam.type = "file"; cam.accept = "image/*"; cam.capture = "environment"; cam.style.display = "none";
    const cb = document.createElement("button"); cb.type = "button"; cb.className = "btn ghost sm"; cb.textContent = L.photo; cb.onclick = () => cam.click(); cam.onchange = () => { add(f, cam.files); cam.value = ""; }; top.append(cb, cam); }
  const ul = document.createElement("ul"); ul.className = "files";
  FILES[f].forEach((x, i) => { const li = document.createElement("li");
    if (/^image\//.test(x.type)) { const im = document.createElement("img"); im.src = x._url || (x._url = URL.createObjectURL(x)); im.alt = ""; li.append(im); }
    const s = document.createElement("span"); s.style.flex = "1"; s.textContent = x.name + " · " + (x.size / 1048576).toFixed(1) + " MB";
    const r = document.createElement("button"); r.type = "button"; r.textContent = "✕"; r.setAttribute("aria-label", "remove"); r.onclick = () => { FILES[f].splice(i, 1); drawDrop(d); refresh(); };
    li.append(s, r); ul.append(li); });
  d.append(top, ul);
}
function add(f, list) { for (const x of list) FILES[f].push(x); drawDrop(document.querySelector(`.drop[data-field="${f}"]`)); refresh(); }
document.querySelectorAll(".drop").forEach(d => {
  d.addEventListener("dragover", e => { e.preventDefault(); d.classList.add("over"); });
  d.addEventListener("dragleave", () => d.classList.remove("over"));
  d.addEventListener("drop", e => { e.preventDefault(); d.classList.remove("over"); add(d.dataset.field, e.dataTransfer.files); });
});
function syncCond() { document.querySelectorAll(".cond").forEach(c => { const v = document.querySelector(`input[name="${c.dataset.when}"]:checked`); c.hidden = !(v && v.value === "Y"); }); }
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));

const radio = n => (document.querySelector(`input[name="${n}"]:checked`) || {}).value || "";
const checks = n => [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(i => i.value);
const num = id => $(id).value === "" ? null : Number($(id).value);
const TEXT_IDS = ["project", "projectHe", "client", "dist", "req", "date", "floors", "rooms", "beds", "baths", "free", "extrasOther", "look", "links"];
function collect() {
  return { project: $("project").value.trim(), projectHe: $("projectHe").value.trim(), client: $("client").value.trim(), distributor: $("dist").value.trim(), requester: $("req").value.trim(), requestDate: $("date").value,
    plans: radio("plans"), planTypes: checks("ptype"), boq: radio("boq"), spec: radio("spec"), cabling: radio("cab"),
    floors: num("floors"), rooms: num("rooms"), beds: num("beds"), baths: $("baths").value, voice: radio("voice"), shabbat: radio("shabbat"),
    includes: checks("feat"), extras: checks("extra"), extrasOther: $("extrasOther").value.trim(), freeText: $("free").value.trim(), look: $("look").value.trim(), links: $("links").value.trim(),
    files: Object.fromEntries(Object.entries(FILES).map(([k, v]) => [k, v.map(f => f.name)])), lang: LANG };
}
function summary(d) {
  const L = T[LANG], yn = v => v === "Y" ? L.yes : v === "N" ? L.no : L.unk, j = a => a.join(", ");
  const lines = [L.title, "",
    `${L.project}: ${d.project}`, `${L.projectHe}: ${d.projectHe}`, `${L.client}: ${d.client}`, `${L.dist}: ${d.distributor}`, `${L.req}: ${d.requester}`, `${L.date}: ${d.requestDate}`, "",
    `${L.plansQ}: ${yn(d.plans)} ${j(d.planTypes.map(k => L.ptypes[k]))}`, `${L.boqQ}: ${yn(d.boq)}`, `${L.specQ}: ${yn(d.spec)}`, `${L.cabQ}: ${yn(d.cabling)}`, "",
    `${L.floors}: ${d.floors ?? ""}`, `${L.rooms}: ${d.rooms ?? ""}`, `${L.beds}: ${d.beds ?? ""}`, `${L.baths}: ${d.baths ? L["baths" + d.baths] : ""}`,
    `${L.voice}: ${yn(d.voice)}`, `${L.shabbat}: ${yn(d.shabbat)}`, `${L.includes}: ${j(d.includes.map(k => L.feats[k]))}`,
    `${L.s4}: ${j(d.extras.map(k => L.extras[k]))} ${d.extrasOther}`, "", `${L.free}: ${d.freeText}`, `${L.look}: ${d.look}`, `${L.links}: ${d.links}`];
  const names = Object.values(FILES).flat().map(f => f.name); if (names.length) lines.push("", `${L.files} (${names.length}): ${j(names)}`);
  return lines.join("\n");
}
function pkgName(d) { const dt = (d.requestDate || new Date().toISOString().slice(0, 10)).split("-").reverse().join(" ");
  return ("Proyecto " + (d.project || d.client || "nuevo") + " " + dt).replace(/[\\/:*?"<>|]+/g, "-").trim(); }
function save() { try { const o = {}; TEXT_IDS.forEach(id => o[id] = $(id).value);
  o.r = Object.fromEntries(["plans", "boq", "spec", "cab", "voice", "shabbat"].map(n => [n, radio(n)])); o.c = [...document.querySelectorAll("input[type=checkbox]:checked")].map(i => i.id);
  localStorage.setItem(DRAFT, JSON.stringify(o)); } catch (_) {} }
function load() { try { const o = JSON.parse(localStorage.getItem(DRAFT) || "null"); if (!o) return; TEXT_IDS.forEach(id => { if (o[id] != null) $(id).value = o[id]; });
  for (const [n, v] of Object.entries(o.r || {})) { const e = document.querySelector(`input[name="${n}"][value="${CSS.escape(v)}"]`); if (e) e.checked = true; }
  (o.c || []).forEach(id => { const e = $(id); if (e) e.checked = true; }); } catch (_) {} }
function refresh() { const t = summary(collect()); $("wa").href = "https://wa.me/?text=" + encodeURIComponent(t); $("preview").textContent = t; save(); }
document.addEventListener("input", refresh);
document.addEventListener("change", e => { if (["plans", "boq", "spec", "cab"].includes(e.target.name)) syncCond(); refresh(); });
const st = (m, cls) => { const s = $("status"); s.className = "status " + (cls || ""); s.textContent = m; };
const ok = () => { const d = collect(); if (!d.project && !d.projectHe && !d.client) { st(T[LANG].need, "err"); $("project").focus(); return null; } return d; };

async function buildZip(d) {
  const zip = new JSZip(), name = pkgName(d), root = zip.folder(name), bar = $("prog").querySelector("i");
  root.file("01 Solicitud/resumen.txt", summary(d)); root.file("01 Solicitud/datos.json", JSON.stringify(d, null, 1));
  for (const [k, list] of Object.entries(FILES)) for (const f of list) root.file(`${FOLDER[k]}/${f.name}`, f);
  $("prog").hidden = false;
  const blob = await zip.generateAsync({ type: "blob", compression: "STORE" }, m => bar.style.width = m.percent + "%");
  setTimeout(() => { $("prog").hidden = true; bar.style.width = 0; }, 1200);
  return new File([blob], name + ".zip", { type: "application/zip" });
}
function dl(file) { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000); }

const b64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(f); });
const post = o => fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ key: KEY }, o)) }).then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error || "error"); return j; });
$("send").onclick = async () => { const d = ok(); if (!d) return; const L = T[LANG], bar = $("prog").querySelector("i");
  $("send").disabled = true; $("prog").hidden = false; bar.style.width = "3%"; st(L.prep);
  try {
    const s0 = await post({ action: "start", mode: MODE, meta: d });
    const list = Object.entries(FILES).flatMap(([k, v]) => v.map(f => [k, f])); const skipped = []; let n = 0;
    for (const [k, f] of list) { if (f.size > 45 * 1048576) { skipped.push(f.name); continue; }
      st(`${++n}/${list.length} · ${f.name}`); await post({ action: "file", folderId: s0.folderId, field: k, name: f.name, mime: f.type, data: await b64(f) });
      bar.style.width = (5 + 90 * n / Math.max(1, list.length)) + "%"; }
    await post({ action: "finish", folderId: s0.folderId, mode: MODE, meta: d, summary: summary(d), count: n });
    bar.style.width = "100%"; st(L.sent + (skipped.length ? " · " + skipped.join(", ") + " " + L.big : ""), skipped.length ? "err" : "ok");
    try { localStorage.removeItem(DRAFT); } catch (_) {}
  } catch (e) { st(e.message + " – ZIP ⬇", "err"); }
  $("send").disabled = false; setTimeout(() => { $("prog").hidden = true; bar.style.width = 0; }, 2000); };
$("share").onclick = async () => { const d = ok(); if (!d) return; const text = summary(d), all = Object.values(FILES).flat();
  const txt = new File([text], pkgName(d) + ".txt", { type: "text/plain" }); const files = [txt, ...all];
  if (navigator.canShare && navigator.canShare({ files })) { try { await navigator.share({ title: pkgName(d), text, files }); st("✓", "ok"); } catch (e) { if (e.name !== "AbortError") st(e.message, "err"); } return; }
  if (navigator.share && !all.length) { try { await navigator.share({ title: pkgName(d), text }); } catch (_) {} return; }
  st(T[LANG].noShare, "err"); };
$("zipb").onclick = async () => { const d = ok(); if (!d) return; if (typeof JSZip === "undefined") { st("JSZip", "err"); return; }
  st(T[LANG].prep); $("zipb").disabled = true;
  try { const f = await buildZip(d); if (navigator.canShare && navigator.canShare({ files: [f] }) && matchMedia("(pointer: coarse)").matches) { try { await navigator.share({ files: [f], title: f.name }); } catch (_) { dl(f); } } else dl(f); st(T[LANG].ready + " · " + f.name, "ok"); }
  catch (e) { st(e.message, "err"); } $("zipb").disabled = false; };
$("copy").onclick = () => { const s = summary(collect());
  (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => st(T[LANG].copied, "ok"), () => { st(T[LANG].copyFail, "err"); const r = document.createRange(); r.selectNodeContents($("preview")); getSelection().removeAllRanges(); getSelection().addRange(r); }); };
$("clear").onclick = () => { if (!confirm(T[LANG].confirm)) return; try { localStorage.removeItem(DRAFT); } catch (_) {} location.reload(); };

setLang(LANG); if (MODE !== "update") load(); if (PRJ && !$("project").value) $("project").value = PRJ; if (!$("date").value) $("date").value = new Date().toLocaleDateString("sv"); syncCond(); refresh();
</script>
