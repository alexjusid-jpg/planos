<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planos">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Planos · Projects · פרויקטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Heebo:wght@400;600;800&display=swap">
<style>
/* Página de inicio: lista de proyectos. Fondo blanco siempre. */
:root{--ink:#1F2630;--muted:#6B7480;--line:#DDE1E6;--soft:#F4F5F7;--accent:#C9662A;--accent-soft:#FBEDE4;--navy:#27306B;
  --font:"Heebo","Barlow Semi Condensed",system-ui,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:15px/1.45 var(--font)}
main{max-width:860px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 60px max(14px,env(safe-area-inset-left,0px))}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:3px solid var(--accent);padding-bottom:12px}
h1{margin:0;font-size:24px;font-weight:800;line-height:1.15}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;font:600 14px var(--font);padding:7px 12px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.new{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:16px 0;padding:14px 16px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;text-decoration:none;color:var(--ink)}
.new b{font-size:18px}.new small{display:block;color:var(--muted);font-size:13px}
.new span.go{background:var(--accent);color:#fff;font-weight:700;padding:10px 16px;border-radius:8px;white-space:nowrap}
h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 8px;font-weight:600}
.card{border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:#fff}
.card.old{border-top-color:#B9C0C8}
.nm{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.nm .he{font-size:20px;font-weight:800;direction:rtl}
.nm .en{font-size:16px;font-weight:600;color:#4A515B;direction:ltr}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.b{font:600 14px var(--font);border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.b.open{background:var(--ink);color:#fff;border-color:var(--ink)}
.b.share{background:var(--navy);color:#fff;border-color:var(--navy)}
.b:disabled{opacity:.6;cursor:default}
.sp{flex:1}
.prog{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:8px}.prog[hidden]{display:none}.prog i{display:block;height:100%;width:0;background:var(--accent)}
.msg{font-size:13px;color:var(--muted);margin-top:6px;min-height:0}
details{margin-top:6px}summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
.tip{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:520px){h1{font-size:20px}.nm .he{font-size:18px}.b{font-size:13px;padding:7px 10px}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1 data-t="title"></h1><p data-t="sub"></p></div>
    <div class="seg" role="group" aria-label="Language"><button data-l="he">עב</button><button data-l="en">EN</button><button data-l="es">ES</button></div>
  </header>

  <a class="new" href="solicitud/" id="newlink"><div><b data-t="newT"></b><small data-t="newS"></small></div><span class="go" data-t="newB"></span></a>

  <h2 data-t="proj"></h2>
  <div id="list"></div>
  <details><summary data-t="old"></summary><div id="olds"></div></details>

  <div class="tip" data-t="tip"></div>
  <p style="margin-top:14px"><a class="b" href="covers/Mis%20links%20Planos%20Master.pdf">📋 Mis links (PDF)</a> <a class="b" href="covers/Mis%20links%20Planos%20Master.html">📋 Mis links</a></p>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const T = {
 he: { title: "פרויקטים · תוכניות תלת-ממד", sub: "קריאת אחות · ACE BG / Advantecnia",
  newT: "📤 פרויקט חדש · העלאת מידע", newS: "טופס: שם הפרויקט, נתונים, תוכניות, כתב כמויות, מפרט טכני, תמונות ורעיונות", newB: "פתיחת הטופס",
  proj: "פרויקטים", old: "גרסאות קודמות", open: "פתיחה", share: "שיתוף", copy: "העתקת קישור", zip: "הורדה (ZIP)",
  copied: "הקישור הועתק", prep: "מכין קובץ…", done: "הקובץ מוכן", fail: "ההורדה נכשלה: ",
  tip: "💡 לשמור באייפון/אייפד: פותחים את הפרויקט ← כפתור שיתוף של ספארי ← \"הוספה למסך הבית\". נוצר אייקון שפותח את הפרויקט. קובץ ה-ZIP הוא גיבוי (תוכניות, PDF, BOQ, מצגות, וידאו); את מודל התלת-ממד פותחים מהקישור." },
 en: { title: "Projects · 3D plans", sub: "Nurse call · ACE BG / Advantecnia",
  newT: "📤 New project · Upload information", newS: "Form: project name, data, drawings, BOQ, technical specification, photos and ideas", newB: "Open the form",
  proj: "Projects", old: "Previous versions", open: "Open", share: "Share", copy: "Copy link", zip: "Download (ZIP)",
  copied: "Link copied", prep: "Preparing file…", done: "File ready", fail: "Download failed: ",
  tip: "💡 To keep it on iPhone/iPad: open the project → Safari Share button → “Add to Home Screen”. You get an icon that opens the project. The ZIP is a backup (plans, PDF, BOQ, decks, video); open the 3D model from the link." },
 es: { title: "Proyectos · Planos 3D", sub: "Llamada de enfermería · ACE BG / Advantecnia",
  newT: "📤 Proyecto nuevo · Subir información", newS: "Formulario: nombre del proyecto, datos, planos, BOQ, מפרט טכני, fotos e ideas", newB: "Abrir el formulario",
  proj: "Proyectos", old: "Versiones anteriores", open: "Abrir", share: "Compartir", copy: "Copiar link", zip: "Descargar (ZIP)",
  copied: "Link copiado", prep: "Preparando archivo…", done: "Archivo listo", fail: "No se pudo descargar: ",
  tip: "💡 Para guardarlo en iPhone/iPad: abrí el proyecto → botón Compartir de Safari → “Agregar a pantalla de inicio”. Queda un ícono que abre el proyecto. El ZIP es una copia de respaldo (planos, PDF, BOQ, presentaciones, video); el modelo 3D se abre desde el link." } };
const QS = new URLSearchParams(location.search);
let L = QS.get("lang"); try { L = L || localStorage.getItem("planos-lang"); } catch (_) {} if (!T[L]) L = "he";
const $ = id => document.getElementById(id);
const BASE = location.href.replace(/[?#].*$/, "").replace(/index\.html$/, "");
let P = [];
const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2000); };
const mb = b => (b / 1048576).toFixed(0) + " MB";

function card(p) {
  const t = T[L], z = p.zip[L], url = BASE + p.open[L];
  const el = document.createElement("div"); el.className = "card" + (p.main ? "" : " old");
  el.innerHTML = `<div class="nm"><span class="he">${p.name.he}</span><span class="en">${p.name.en}</span></div>
  ${p.sub[L] ? `<div class="sub">${p.sub[L]}${L === "es" ? " · " + p.name.es : ""}</div>` : ""}
  <div class="row">
    <a class="b open" href="${p.open[L]}">▶ ${t.open}</a>
    <a class="b" href="${p.open.he}">עב</a><a class="b" href="${p.open.en}">EN</a><a class="b" href="${p.open.es}">ES</a>
    ${p.cover ? `<a class="b" href="${encodeURI(p.cover)}">📄 PDF</a>` : ""}<span class="sp"></span>
    <button class="b share">⤴ ${t.share}</button><button class="b cp">🔗 ${t.copy}</button>
    <button class="b dz">⬇ ${t.zip} · ${mb(z.bytes)}</button>
  </div><div class="prog" hidden><i></i></div><div class="msg"></div>`;
  const title = `${p.name.he} · ${p.name.en}`;
  el.querySelector(".share").onclick = async () => {
    if (navigator.share) { try { await navigator.share({ title, text: title, url }); } catch (_) {} }
    else open("https://wa.me/?text=" + encodeURIComponent(title + "\n" + url), "_blank");
  };
  el.querySelector(".cp").onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast(t.copied), () => prompt("", url)); };
  el.querySelector(".dz").onclick = e => makeZip(p, el, e.currentTarget);
  return el;
}

async function makeZip(p, el, btn) {
  const t = T[L], z = p.zip[L], pr = el.querySelector(".prog"), bar = pr.querySelector("i"), msg = el.querySelector(".msg");
  if (typeof JSZip === "undefined") { msg.textContent = t.fail + "JSZip"; return; }
  btn.disabled = true; pr.hidden = false; msg.textContent = t.prep;
  try {
    const zip = new JSZip(); let done = 0;
    const folder = (p.name.en.split(" – ")[0] + "_" + L).replace(/[^\w.-]+/g, "_");
    const root = zip.folder(folder);
    const url = BASE + p.open[L];
    root.file("OPEN_ME_פתח.html", `<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${p.name.en}</title><body style="font:18px system-ui;padding:24px;background:#fff"><h2>${p.name.he}<br>${p.name.en}</h2><p><a href="${url}">${url}</a></p><p><a href="${p.open[L]}index.html">Offline (PC)</a></p></body>`);
    const queue = [...z.files]; const N = queue.length;
    const worker = async () => { while (queue.length) { const f = queue.shift(); const r = await fetch(f); if (!r.ok) throw new Error(f + " " + r.status);
      root.file(f, await r.blob(), { binary: true }); done++; bar.style.width = (done / N * 85) + "%"; } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    const blob = await zip.generateAsync({ type: "blob", compression: "STORE" }, m => { bar.style.width = (85 + m.percent * 0.15) + "%"; });
    const name = folder + ".zip"; const file = new File([blob], name, { type: "application/zip" });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia("(pointer: coarse)").matches) {
      try { await navigator.share({ files: [file], title: name }); } catch (_) { dl(blob, name); }
    } else dl(blob, name);
    msg.textContent = t.done + " · " + name;
  } catch (e) { msg.textContent = t.fail + e.message; }
  btn.disabled = false; setTimeout(() => { pr.hidden = true; bar.style.width = 0; }, 1500);
}
function dl(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000); }

function render() {
  const t = T[L]; document.documentElement.lang = L; document.documentElement.dir = L === "he" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t[e.dataset.t]);
  document.querySelectorAll("[data-l]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === L)));
  $("newlink").href = "solicitud/?lang=" + L;
  $("list").replaceChildren(...P.filter(p => p.main).map(card));
  $("olds").replaceChildren(...P.filter(p => !p.main).map(card));
}
document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { L = b.dataset.l; try { localStorage.setItem("planos-lang", L); } catch (_) {} render(); });
fetch("projects.json", { cache: "no-cache" }).then(r => r.json()).then(j => { P = j; render(); }).catch(() => render());
render();
</script>
</body>
</html>
