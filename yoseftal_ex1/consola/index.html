<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consola Monitor Demo</title><style>
html,body{margin:0;background:#fff;overflow:hidden;height:100%}

*{box-sizing:border-box}#app{width:1366px;height:768px;transform-origin:0 0;font-family:Tahoma,"DejaVu Sans",Arial,sans-serif;font-size:13px;color:#1b1b1b;background:linear-gradient(180deg,#eef3fb,#e3ebf7);overflow:hidden;position:relative}
.side{position:absolute;left:8px;top:8px;width:112px}.logo{height:92px;border:0;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
.fk{height:74px;margin-bottom:8px;border:2px solid #7b8ba3;border-radius:3px;background:linear-gradient(#f8fbff,#d9e3f1);position:relative;display:flex;align-items:center;justify-content:center}
.fk b{position:absolute;left:4px;top:2px;font-size:11px;color:#333;background:#dfe7f3;padding:0 3px}.pwr{width:74px;height:74px;border-radius:50%;margin:14px auto 10px;background:radial-gradient(circle at 40% 35%,#9cc3f0,#2c5fa8);border:3px solid #5d6f8c;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}
.brand{font:700 13px Arial;letter-spacing:1px;color:#27306b;text-align:center}.brand span{color:#e2631a}.url{font-size:8px;color:#777;text-align:center}
.top{position:absolute;left:132px;top:8px;display:flex;gap:8px;align-items:flex-start}.tk{width:104px;height:66px;border:2px solid #7b8ba3;background:linear-gradient(#f8fbff,#d9e3f1);position:relative}.tk b{position:absolute;left:4px;top:2px;font-size:11px;background:#dfe7f3;padding:0 3px}
.mon{margin-left:6px;width:150px;text-align:center}.mon .ic{font-size:30px;line-height:40px}.mon .lb{border-top:1px solid #333;font-size:11px;padding-top:2px}
.alarm{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff8a6a,#c0261b);border:2px solid #8a1d14;color:#fff;font:700 26px Arial;display:flex;align-items:center;justify-content:center;margin-left:60px;margin-top:8px}
.desk{position:absolute;right:20px;top:42px;font-size:11px;color:#333}
.calls{position:absolute;left:132px;top:96px;width:840px;display:grid;grid-template-columns:repeat(3,272px);gap:8px}
.call{height:92px;border:1px solid #9aa9bf;border-radius:4px;background:linear-gradient(#fdfdfd,#e6ecf5);box-shadow:1px 2px 3px rgba(0,0,0,.25);position:relative;padding:4px}
.ico{position:absolute;left:6px;top:8px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;border:2px solid #555}
.r1{position:absolute;left:60px;top:4px;width:176px;height:18px;border:1px solid #888;background:#fff;text-align:center;font-size:11px}.n{position:absolute;right:6px;top:4px;width:22px;height:18px;border:1px solid #888;background:#fff;text-align:center;font-size:11px}
.r2{position:absolute;left:60px;top:26px;width:204px;height:18px;border:1px solid #888;background:#fff;text-align:center;font-size:11px;font-weight:700}
.tm{position:absolute;left:8px;top:60px;font-size:11px}.dur{position:absolute;left:8px;top:74px;font-size:10px;border:1px solid #888;background:#fff;padding:0 3px}
.st{position:absolute;left:96px;top:66px;font-size:12px;font-weight:700}.inf{position:absolute;right:8px;top:52px;width:36px;height:30px;border:1px solid #333;background:#fff;font:italic 700 18px Georgia;text-align:center}
.stats{position:absolute;left:1000px;top:96px;width:350px;height:470px;border:1px solid #9aa9bf;padding:10px 14px;font-size:12px}.stats h4{margin:-18px 0 10px;background:#e8eef8;display:inline-block;padding:0 4px;font-weight:400;font-size:11px}
.row{display:flex;justify-content:space-between;margin:6px 0}.q{display:flex;align-items:center;gap:8px;margin:7px 0}.q span:first-child{width:120px}.box{width:46px;height:20px;border:1px solid #888;background:#fff;text-align:center}.pc{width:52px;height:20px;color:#fff;text-align:center;font-size:11px;line-height:20px}
.pie{width:190px;height:190px;border-radius:50%;margin:24px 0 0 20px;box-shadow:0 8px 0 #4a7a2a}.leg{position:absolute;right:20px;top:270px;font-size:11px}.leg i{display:inline-block;width:16px;height:9px;margin-right:4px}
.scroll{position:absolute;left:982px;top:96px;width:12px;height:470px;border:1px solid #999;background:#f2f2f2}
.panel{position:absolute;left:132px;top:96px;width:860px;height:600px;border:1px solid #9aa9bf;background:#f4f7fc;padding:14px}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid #ccd5e3;padding:5px 6px;text-align:left}th{background:#dfe7f3}
.bar{display:inline-block;height:14px;vertical-align:middle}

#app{position:absolute;left:0;top:0;font-family:Tahoma,"DejaVu Sans",Arial,sans-serif;font-size:13px;color:#1b1b1b;background:linear-gradient(180deg,#eef3fb,#e3ebf7);overflow:hidden}
.fk,.tk,.call,.alarm,.inf{cursor:pointer;user-select:none}.fk.on,.tk.on{border-color:#e2631a;box-shadow:0 0 0 2px #e2631a inset}
.call.new{animation:bl 1s infinite}@keyframes bl{50%{box-shadow:0 0 0 3px #d93025}}
.call.blue{animation:bb 0.8s infinite}@keyframes bb{50%{box-shadow:0 0 0 4px #1f5fd6}}
.alarm.on{animation:al .6s infinite}@keyframes al{50%{filter:brightness(1.6)}}
.calls{max-height:600px;overflow:auto}
.hint{position:absolute;left:132px;top:700px;font-size:11px;color:#556}
#dock{position:fixed;left:0;right:0;bottom:0;background:#F4F5F7;border-top:1px solid #DDE1E6;color:#1F2630;font:13px Arial,sans-serif;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;z-index:9}
#dock b{color:#C9662A;margin-right:6px}#dock button{font:600 12px Arial;border:0;border-radius:16px;padding:7px 12px;cursor:pointer;color:#fff}
#dock select{font:12px Arial;border-radius:6px;padding:5px}
.toast{position:absolute;right:20px;top:600px;background:#27306b;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:.3s}.toast.on{opacity:1}
</style></head><body><div id="app">
<div class="side"><div class="logo"><svg width="96" height="86" viewBox="0 0 96 86"><rect x="4" y="4" width="78" height="54" rx="4" fill="#fff" stroke="#14213d" stroke-width="5"/><rect x="14" y="14" width="18" height="8" fill="#3a6fd8"/><rect x="38" y="14" width="18" height="8" fill="#3a6fd8"/><rect x="14" y="28" width="18" height="8" fill="#3a6fd8"/><circle cx="66" cy="48" r="14" fill="#2d58c7"/><circle cx="66" cy="38" r="9" fill="#f2d2b0"/><rect x="58" y="28" width="16" height="6" fill="#fff"/><text x="2" y="80" font-size="12" font-weight="700" fill="#2d58c7">CONSOLA</text><circle cx="86" cy="76" r="7" fill="#2d58c7"/><text x="82" y="80" font-size="11" fill="#fff">+</text></svg></div>
<div class="fk"><b>F1</b><span style="font-size:34px">☎</span></div><div class="fk"><b>F2</b><span style="font-size:34px;color:#d32">⚠</span></div><div class="fk"><b>F3</b></div><div class="fk"><b>F4</b></div><div class="fk"><b>F5</b></div><div class="fk"><b>F6</b><span style="font-size:26px">🔍</span></div>
<div class="pwr">⏻</div><div class="brand">ADVANT<span>CARE</span></div><div class="url">www.advantcare.net</div></div>
<div class="top"><div class="tk"><b>F7</b><span style="position:absolute;left:36px;top:18px;font-size:28px">🖥</span></div><div class="tk"><b>F8</b></div><div class="tk"><b>F9</b></div><div class="tk"><b>F10</b></div>
<div class="mon"><div class="ic">📢🔒</div><div class="lb">Consola Monitor</div></div><div class="alarm">!</div></div>
<div class="desk" id="desk">Nurse Desk · Surgery</div>
<div id="main"></div><div class="hint">F1 Calls · F2 Alarms · F6 History · F7 Statistics by area · click a call: 1st = PRESENCE, 2nd = CANCEL · ⓘ = bed history</div><div class="toast" id="toast"></div></div>
<div id="dock"><button id="backb" style="background:#1F2430" onclick="goBack()"></button><b>DEMO</b>
<select id="room"><option>Room 1</option><option>Room 2</option><option selected>Room 3</option><option>Room 4</option></select>
<select id="bed"><option selected>BED 1</option><option>BED 2</option><option>BED 3</option></select>
<button style="background:#d93025" onclick="newCall('bed')">🔔 Patient call / קריאה</button>
<button style="background:#e8710a" onclick="newCall('wc')">⚠ WC pull-cord / מצוקה</button>
<button style="background:#1f5fd6" onclick="newCall('blue')">✚ Code blue</button>
<button style="background:#1e9e3e" onclick="act('presence')">✓ Presence / נוכחות</button>
<button style="background:#6b7280" onclick="act('cancel')">✕ Cancel / ביטול</button>
<button style="background:#e2631a" id="auto" onclick="toggleAuto()">▶ Auto demo</button>
</div>
<script>
const LQ=(new URLSearchParams(location.search).get("lang"))||"he";document.getElementById("backb").textContent={es:"← Volver al plano",en:"← Back to the plans",he:"← חזרה לתוכנית"}[LQ]||"← Back";
function goBack(){if(document.referrer&&history.length>1)history.back();else location.href="../"+LQ+"/";}
const app=document.getElementById("app"),main=document.getElementById("main");
function fit(){const dh=document.getElementById("dock").offsetHeight;const s=Math.min(innerWidth/1366,(innerHeight-dh)/768);app.style.transform=`scale(${s})`;app.style.left=((innerWidth-1366*s)/2)+"px"}
addEventListener("resize",fit);
const pad=n=>String(n).padStart(2,"0"),hms=d=>pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
const dur=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+"m "+pad(s%60)+"s"};
let seq=0,view="main",histKey=null;
const now=Date.now();
let calls=[{id:++seq,type:"bed",area:"Room 2",bed:"BED 3",t:now-134000,state:"wait"},{id:++seq,type:"wc",area:"WC B3",bed:"BATHROOM 1",t:now-107000,state:"wait"},{id:++seq,type:"bed",area:"Room 1",bed:"BED 2",t:now-420000,state:"presence",tp:now-38000}];
let closed=[];{const B={"Room 1":["BED 1","BED 2","BED 3"],"Room 2":["BED 1","BED 2","BED 3"],"Room 3":["BED 1","BED 2","BED 3"],"Room 4":["BED 1","BED 2","BED 3"],"WC B2":["BATHROOM 1"],"WC B3":["BATHROOM 1"]};let k=0;
 for(const a in B)for(const bd of B[a])for(let j=0;j<3;j++){k++;const wc=a.startsWith("WC");closed.push({seed:1,area:a,bed:bd,type:wc?"wc":(k%17===0?"blue":"bed"),t:now-600000-((k*37)%49)*1600000,wait:4000+(k*3571)%40000,pres:120000+(k*7351)%240000,by:"Nurse "+(1+k%3)})}
 closed.sort((x,y)=>y.t-x.t)}
// baseline counters (today) so stats look like a real shift
const base={n:64,q:53,m:7,s:4,wait:11*64,pres:262*64};
const AREAS=["Room 1","Room 2","Room 3","Room 4","WC B2","WC B3"];
const areaBase={"Room 1":[13,9,250],"Room 2":[18,12,302],"Room 3":[10,8,220],"Room 4":[15,15,295],"WC B2":[3,6,140],"WC B3":[5,5,165]};
const ICON={bed:["#d93025","🔔"],wc:["#e8710a","⚠"],blue:["#1f5fd6","✚"]};
let ctx;function beep(f,d){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.value=.08;o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800)}
function cls(w){return w<=15000?"q":w<=45000?"m":"s"}
function totals(){let n=base.n,q=base.q,m=base.m,s=base.s,ws=base.wait,ps=base.pres;closed.filter(c=>!c.seed).forEach(c=>{n++;({q:()=>q++,m:()=>m++,s:()=>s++})[cls(c.wait)]();ws+=c.wait/1000;ps+=c.pres/1000});
 return{n,q,m,s,w:ws/n,p:ps/n}}
const fm=s=>Math.floor(s/60)+" m. "+Math.round(s%60)+" s.";
function stats(){const T=totals(),pq=Math.round(T.q/T.n*100),pm=Math.round(T.m/T.n*100),ps=100-pq-pm,d=new Date();
 return `<div class="stats"><h4>Statistics today (${d.toLocaleDateString("en-GB")} ${hms(d)})</h4><div class="row"><span>Average time wait:</span><span>${fm(T.w)}</span></div><div class="row"><span>Average time presence:</span><span>${fm(T.p)}</span></div><div class="row"><span>Num. Calls:</span><span style="margin-right:150px">${T.n}</span></div>
<div class="q"><span>#Quick assist:</span><span class="box">${T.q}</span><span class="pc" style="background:#3bbf2b">${pq}%</span></div><div class="q"><span>#Average assist:</span><span class="box">${T.m}</span><span class="pc" style="background:#e8710a">${pm}%</span></div><div class="q"><span>#Slow assist:</span><span class="box">${T.s}</span><span class="pc" style="background:#d93025">${ps}%</span></div>
<div class="pie" style="background:conic-gradient(#3bbf2b 0 ${pq}%,#c8d63a ${pq}% ${pq+pm}%,#c0392b ${pq+pm}% 100%)"></div><div class="leg"><i style="background:#3bbf2b"></i>Quick<br><i style="background:#c8d63a"></i>Medium<br><i style="background:#c0392b"></i>Slow</div></div>`}
function card(c,i){const canc=c.state==="cancelled",pres=c.state==="presence";const [col,ic]=pres?["#1e9e3e","✓"]:ICON[c.type];const T=Date.now();
 const st=canc?"":pres?`<div class="st" style="color:#1e9e3e">PRESENCE</div>`:`<div class="st" style="color:${col}">${c.type==="blue"?"CODE BLUE":"WAIT..."}</div>`;
 return `<div class="call ${c.state==="wait"?(c.type==="blue"?"blue":"new"):""}" data-id="${c.id}"><div class="ico" style="background:${canc?"radial-gradient(circle at 40% 35%,#777,#222)":col}">${canc?"":ic}</div><div class="r1">${c.area}</div><div class="n">${i+1}</div><div class="r2">${c.bed}, ${c.area}</div>`+
 (canc?`<div style="position:absolute;left:6px;right:6px;top:52px;height:34px;border:1px solid #7a8aa3;background:linear-gradient(#cfd9ea,#9fb1cc);font:700 22px Arial;color:#333;text-align:center;line-height:34px">CANCELLED</div>`:
 `<div class="tm">${hms(new Date(c.t))}</div><div class="dur">${dur(T-(pres?c.tp:c.t))}</div>${st}<div class="inf" data-h="${c.area}|${c.bed}">i</div>`)+`</div>`}
function render(){document.querySelectorAll(".fk,.tk").forEach(e=>e.classList.toggle("on",e.querySelector("b").textContent===({main:"F1",alarms:"F2",hist:"F6",area:"F7"})[view]));
 document.querySelector(".alarm").classList.toggle("on",calls.some(c=>c.state==="wait"));
 if(view==="main"||view==="alarms"){let list=view==="main"?calls:calls.filter(c=>c.type!=="bed");if(view==="alarms"&&!list.length)list=[];
  const done=view==="main"?closed.slice(0,Math.max(0,9-calls.length)).map(c=>({...c,state:"cancelled",id:0})):[];
  main.innerHTML='<div class="calls">'+list.concat(done).map(card).join("")+'</div><div class="scroll"></div>'+stats();}
 if(view==="area"){const rows=AREAS.map(a=>{const b=areaBase[a];let n=b[0],w=b[1]*b[0],p=b[2]*b[0],q=Math.round(b[0]*.82),m=Math.round(b[0]*.12);closed.filter(c=>!c.seed).filter(c=>c.area===a).forEach(c=>{n++;w+=c.wait/1000;p+=c.pres/1000;if(cls(c.wait)==="q")q++;else if(cls(c.wait)==="m")m++});return[a,n,w/n,p/n,q,m,n-q-m]});
  main.innerHTML=`<div class="panel"><b style="font-size:15px">Statistics by area · today</b><table style="margin-top:12px"><tr><th>Area</th><th>Calls</th><th>Avg. wait</th><th>Avg. presence</th><th>Quick</th><th>Average</th><th>Slow</th></tr>`+
  rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${fm(r[2])}</td><td>${fm(r[3])}</td><td><span class="bar" style="width:${r[4]*6}px;background:#3bbf2b"></span> ${r[4]}</td><td><span class="bar" style="width:${r[5]*6}px;background:#e8a10a"></span> ${r[5]}</td><td><span class="bar" style="width:${r[6]*6}px;background:#d93025"></span> ${r[6]}</td></tr>`).join("")+`</table>`+
  `<div style="display:flex;gap:40px;margin-top:26px;align-items:center">${stats().match(/<div class="pie"[^>]*><\/div>/)[0].replace('class="pie"','class="pie" ')}<div style="font-size:13px;line-height:22px"><i style="display:inline-block;width:14px;height:10px;background:#3bbf2b"></i> Quick (&lt; 15 s)<br><i style="display:inline-block;width:14px;height:10px;background:#c8d63a"></i> Medium (15–45 s)<br><i style="display:inline-block;width:14px;height:10px;background:#c0392b"></i> Slow (&gt; 45 s)</div></div></div>`;}
 if(view==="hist"){const L=closed.filter(c=>!histKey||(c.area+"|"+c.bed)===histKey);
  main.innerHTML=`<div class="panel"><b style="font-size:15px">Call history${histKey?" · "+histKey.replace("|"," · "):" · all areas"}</b> ${histKey?'<a href="#" id="all" style="margin-left:12px;font-size:12px">show all</a>':""}<table style="margin-top:12px"><tr><th>Date</th><th>Area</th><th>Call</th><th>Origin</th><th>Wait</th><th>Presence</th><th>Closed by</th></tr>`+
  (L.length?L.slice(0,18).map(c=>{const d=new Date(c.t);return `<tr><td>${d.toLocaleDateString("en-GB")} ${pad(d.getHours())}:${pad(d.getMinutes())}</td><td>${c.area} · ${c.bed}</td><td style="${c.type==="blue"?"color:#1f5fd6;font-weight:700":""}">${c.type==="bed"?"Patient call":c.type==="wc"?"Bathroom":"Code blue"}</td><td>${c.type==="bed"?"Pear":c.type==="wc"?"Pull-cord":"Panel"}</td><td>${dur(c.wait)}</td><td>${dur(c.pres)}</td><td>${c.by}</td></tr>`}).join(""):`<tr><td colspan=7>No calls yet</td></tr>`)+`</table></div>`;
  const a=document.getElementById("all");if(a)a.onclick=e=>{e.preventDefault();histKey=null;render()}}
}
function newCall(type){const r=document.getElementById("room").value,b=document.getElementById("bed").value;
 const area=type==="wc"?(r==="Room 1"||r==="Room 2"?"WC B3":"WC B2"):r,bed=type==="wc"?"BATHROOM 1":b;
 const ex=calls.find(c=>c.area===area&&c.bed===bed);if(ex){if(type==="blue"){ex.type="blue";ex.state="wait";ex.t=Date.now();delete ex.tp;view="main";beep(1200,.3);toast("CODE BLUE: "+bed+", "+area);render()}else toast(area+" · "+bed+": call already active");return}
 calls.unshift({id:++seq,type,area,bed,t:Date.now(),state:"wait"});view="main";beep(type==="blue"?1200:880,.25);setTimeout(()=>beep(type==="blue"?1200:880,.25),350);toast("New call: "+bed+", "+area);render()}
function step(c){if(!c)return;if(c.state==="wait"){c.state="presence";c.tp=Date.now();toast("Presence: "+c.area);beep(520,.12)}
 else{calls=calls.filter(x=>x!==c);closed.unshift({area:c.area,bed:c.bed,type:c.type,t:c.t,wait:(c.tp||Date.now())-c.t,pres:Date.now()-(c.tp||Date.now()),by:"Nurse "+(1+Math.floor(Math.random()*3))});toast("Cancelled: "+c.area);beep(400,.12)}render()}
function act(k){const c=k==="presence"?calls.find(c=>c.state==="wait"):calls.find(c=>c.state==="presence")||calls.find(c=>c.state==="wait");if(!c){toast(k==="presence"?"No waiting calls":"No active calls");return}if(k==="cancel"&&c.state==="wait"){c.state="presence";c.tp=Date.now()}step(c)}
main.addEventListener("click",e=>{const i=e.target.closest(".inf");if(i){histKey=i.dataset.h;view="hist";render();return}const c=e.target.closest(".call");if(c&&+c.dataset.id)step(calls.find(x=>x.id===+c.dataset.id))});
const KEYV={F1:"main",F2:"alarms",F6:"hist",F7:"area"};
document.querySelectorAll(".fk,.tk").forEach(e=>e.onclick=()=>{const k=e.querySelector("b").textContent;if(KEYV[k]){view=KEYV[k];if(k==="F6")histKey=null;render()}});
document.querySelector(".alarm").onclick=()=>{view="alarms";render()};
addEventListener("keydown",e=>{if(KEYV[e.key]){e.preventDefault();view=KEYV[e.key];if(e.key==="F6")histKey=null;render()}});
let auto=null;function toggleAuto(){const b=document.getElementById("auto");if(auto){clearInterval(auto);auto=null;b.textContent="▶ Auto demo";return}b.textContent="■ Stop";
 let k=0;const run=()=>{const R=["Room 1","Room 2","Room 3","Room 4"][Math.floor(Math.random()*4)];document.getElementById("room").value=R;document.getElementById("bed").value="BED "+(1+Math.floor(Math.random()*3));
  const m=k++%4;for(let z=0;z<8&&calls.some(c=>c.area===document.getElementById("room").value&&c.bed===document.getElementById("bed").value);z++){document.getElementById("room").value=["Room 1","Room 2","Room 3","Room 4"][z%4];document.getElementById("bed").value="BED "+(1+(z+k)%3)}if(m===0)newCall(Math.random()<.2?"wc":"bed");else if(m===1)act("presence");else if(m===2)newCall(Math.random()<.15?"blue":"bed");else act("cancel")};run();auto=setInterval(run,3500)}
setInterval(()=>{if(view==="main"||view==="alarms")render()},1000);
fit();render();
</script></body></html>
