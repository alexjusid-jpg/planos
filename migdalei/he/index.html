<style>
/* Layout: lienzo 3D a pantalla completa; barra de control flotante arriba, leyenda abajo-izquierda, ficha del dispositivo abajo-derecha. Look único claro (fondo blanco, preferencia del cliente). */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --ink:#1F2630; --muted:#6B7480; --line:#DDE1E6; --soft:#F3F5F7;
  --accent:#D9620B; --bus:#1A9E4B; --net:#D62839; --pwr:#1F66D1;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--display);}
body{overflow:hidden}
#stage{position:fixed;inset:0;background:var(--bg)}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.bar{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
  background:var(--panel);border:1px solid var(--line);padding:8px 12px;box-shadow:0 2px 10px rgba(30,40,55,.06);z-index:5}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:6px;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp label.cap{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
button,select{font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink);background:var(--soft);border:1px solid var(--line);padding:5px 10px;cursor:pointer;border-radius:3px}
button:hover{border-color:#B9C0C8}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
button.play{background:var(--accent);color:#fff;border-color:var(--accent)}
button.play[aria-pressed="true"]{background:#fff;color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;border-radius:0;background:#fff}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button+button{border-left:1px solid var(--line)}
.legend{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);padding:10px 12px;max-width:min(360px,calc(100% - 32px));z-index:4}
.legend h3{margin:0 0 6px;font-size:12px;font-family:var(--mono);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.legend li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;font-size:13.5px;line-height:1.2}
.sw{height:6px;border-radius:3px}
.sw.dash{background:repeating-linear-gradient(90deg,var(--bus) 0 6px,transparent 6px 9px)!important}
.chip{width:14px;height:14px;border:1px solid rgba(0,0,0,.25);justify-self:center}
.tri{width:14px;height:14px;justify-self:center;border:1px solid rgba(0,0,0,.25);background:linear-gradient(90deg,#E53935 0 33%,#2E9F4F 33% 66%,#1E6BD6 66%)}
.info{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);padding:10px 14px;width:min(320px,calc(100% - 32px));z-index:4}
.info h4{margin:0 0 4px;font-size:16px}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.info dt{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;padding-top:2px}
.info dd{margin:0}
.info .x{position:absolute;right:6px;top:4px;background:none;border:0;font-size:18px;color:var(--muted);padding:2px 6px}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;color:var(--ink);background:rgba(255,255,255,.92);border:1px solid var(--line);padding:1px 6px;z-index:3}
.tag.room{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-color:transparent;background:rgba(255,255,255,.75)}
.tag.room.apt{font-size:14px;background:#fff;border:1px solid #E8C9AE;color:#8A3E05}
.tag.room.big{font-size:18px;background:#fff;border:2px solid var(--accent);color:var(--ink)}
.lph{width:28px;height:22px;object-fit:cover;border:1px solid var(--line);border-radius:2px;background:#fff}
.iph{display:block;width:100%;max-height:150px;object-fit:contain;margin-top:8px;background:#fff;border-top:1px solid var(--line);padding-top:6px}
.iph[hidden]{display:none}
.tag.dev{font-family:var(--mono);font-size:10.5px;font-weight:500;border-color:#E8C9AE;color:#8A3E05}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.timeline{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);padding:6px 12px;font-size:14px;font-weight:600;z-index:4;max-width:calc(100% - 32px);text-align:center}
.timeline small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);color:var(--muted);font-size:13px;z-index:1}
[dir="rtl"] .legend li{direction:rtl}
.pad{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:56px 56px auto;gap:6px;z-index:6}
.pad button{font-size:22px;padding:0;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(30,40,55,.12);touch-action:none;user-select:none}
.pad[hidden]{display:none}
.pad button.b{grid-column:2}
.pad button:active{background:var(--accent);color:#fff}
.fphint{grid-column:1/4;font-family:var(--mono);font-size:10.5px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:4px 6px;text-align:center}
body.fpmode .legend{display:none}
.docpanel{position:fixed;right:16px;top:120px;width:min(460px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent);padding:12px 14px;z-index:7;box-shadow:0 6px 24px rgba(30,40,55,.12)}
.docview{position:fixed;inset:0;background:rgba(240,242,245,.85);z-index:9;display:grid;place-items:center;padding:16px}
.docview[hidden]{display:none}
.dv-in{position:relative;background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent);padding:12px 14px;width:min(1100px,100%)}
.dv-in h4{margin:0 0 8px;font-size:17px}
.dv-in .x{position:absolute;right:6px;top:4px;background:none;border:0;font-size:22px;color:var(--muted);padding:2px 8px}
.docpanel h4{margin:0 0 8px;font-size:17px}
.docpanel ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:calc(100vh - 220px);overflow:auto}
.drow{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:8px 10px;border-radius:4px}
.dtag{font-family:var(--mono);font-size:11px;color:#fff;background:var(--accent);text-align:center;padding:3px 0;border-radius:3px}
.dtxt{font-weight:600;font-size:14px;line-height:1.2}
.dtxt small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.dact{display:flex;gap:6px}
.dbtn{font-family:var(--display);font-size:13px;font-weight:600;padding:5px 10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:3px;text-decoration:none;cursor:pointer}
.dbtn.dl{background:var(--accent);border-color:var(--accent);color:#fff}
#docs{background:var(--accent);color:#fff;border-color:var(--accent)}
.dvback{display:block;margin:0 0 10px;font-size:16px;padding:9px 16px}
.dv-in .x{font-size:30px!important;padding:4px 12px!important}
.docpanel a{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);padding:8px 10px;border-radius:4px}
.docpanel a:hover{border-color:var(--accent)}
.docpanel b{font-family:var(--mono);font-size:11px;color:#fff;background:var(--accent);text-align:center;padding:3px 0;border-radius:3px}
.docpanel small{display:block;color:var(--muted);font-size:12px}
.docpanel .x{position:absolute;right:6px;top:4px;background:none;border:0;font-size:18px;color:var(--muted);padding:2px 6px}
body.fpmode .info{bottom:auto;top:96px}
#stage canvas.fpcur{cursor:grab}
body.capture .bar,body.capture .legend,body.capture .info,body.capture .pad,body.capture .docpanel,body.capture .docview{display:none!important}
@media (max-width:720px){.legend{display:none}.bar{gap:6px}.brand span{display:none}button,select{font-size:13px;padding:4px 8px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.menubtn{display:none}
body.compact .bar{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));padding:6px 8px;gap:6px 8px;max-height:calc(100vh - 24px);overflow:auto;flex-wrap:wrap}
body.compact .menubtn{display:inline-block;font-size:15px;padding:6px 12px;background:var(--ink);color:#fff;border-color:var(--ink)}
body.compact .menubtn.doc{background:var(--accent);border-color:var(--accent);padding:6px 10px}
body.compact .brand{flex:1;min-width:0}
body.compact .brand b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.compact .brand span{display:none}
body.compact .bar .grp{display:none}
body.compact.menu-open .bar .grp{display:flex;width:100%;margin-left:0!important}
body.compact.menu-open .bar .grp select{flex:1;min-width:0;font-size:15px;padding:7px 8px}
body.compact.menu-open .bar .grp button{font-size:15px;padding:7px 10px}
body.compact.menu-open .menubtn.doc{display:none}
body.compact .legend{display:none}
body.compact .info{left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:42vh;overflow:auto;padding:8px 10px}
body.compact .info .iph{max-height:110px}
body.compact .docpanel{left:8px;right:8px;width:auto;top:calc(60px + env(safe-area-inset-top,0px));max-height:calc(100vh - 80px);overflow:auto}
body.compact .docpanel ul{max-height:none}
body.compact .drow{grid-template-columns:40px 1fr;}
body.compact .dact{grid-column:1/3;justify-content:flex-end}
body.compact .timeline{font-size:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
body.compact .pad{right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(3,48px);grid-template-rows:48px 48px auto}
body.compact .tag{font-size:10px}
body.compact .tag.room{font-size:10.5px}
</style>
